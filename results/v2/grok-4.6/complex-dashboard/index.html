<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>缺血钟 · 华东 OPO 夜班配型裁决台</title>
<style>
  :root {
    --bg: #0b100e;
    --bg-2: #101714;
    --panel: #151e1a;
    --panel-2: #1b2621;
    --line: #2a3c34;
    --line-2: #3d5348;
    --text: #e7eee8;
    --muted: #87a094;
    --faint: #5d7468;
    --gold: #d7b45c;
    --amber: #e09a3a;
    --red: #e05656;
    --green: #4cbf8f;
    --cyan: #6ec8bc;
    --heart: #d56d6d;
    --liver: #c9a45a;
    --kidney: #6d96bc;
    --lung: #74b89a;
    --docket: #1a1712;
    --docket-line: #3a3428;
    --docket-paper: #f3ead2;
    --docket-ink: #1c1810;
    --shadow: 0 18px 40px rgba(0,0,0,.35);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    background:
      radial-gradient(1200px 500px at 70% -10%, rgba(215,180,92,.08), transparent 50%),
      linear-gradient(180deg, #0e1512 0%, var(--bg) 40%);
    color: var(--text);
    overflow: hidden;
  }
  body::before {
    content: "";
    position: fixed; inset: 0; pointer-events: none; opacity: .18;
    background:
      repeating-linear-gradient(0deg, transparent 0 3px, rgba(255,255,255,.015) 3px 4px),
      repeating-linear-gradient(90deg, transparent 0 7px, rgba(76,191,143,.03) 7px 8px);
  }
  button, input, select, textarea { font-family: inherit; }
  button { cursor: pointer; }
  .mono { font-family: Consolas, "Cascadia Mono", "Sarasa Mono SC", monospace; }
  #app {
    height: 100%;
    display: grid;
    grid-template-rows: 56px 132px minmax(0, 1fr) 168px;
    gap: 0;
  }

  header {
    display: grid;
    grid-template-columns: auto 1fr auto auto;
    align-items: center;
    gap: 22px;
    padding: 0 18px;
    border-bottom: 1px solid var(--line);
    background: rgba(12,18,15,.88);
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .mark { width: 34px; height: 34px; }
  .brand h1 {
    font-size: 15px; font-weight: 650; letter-spacing: .12em;
    text-transform: uppercase;
  }
  .brand p { font-size: 11px; color: var(--muted); letter-spacing: .08em; }
  .shift {
    display: flex; gap: 18px; align-items: center;
    font-size: 12px; color: var(--muted);
  }
  .shift b { color: var(--text); font-weight: 600; }
  .pulse-dot {
    width: 8px; height: 8px; border-radius: 50%; background: var(--green);
    box-shadow: 0 0 0 0 rgba(76,191,143,.7);
    animation: pulse 1.8s infinite;
  }
  @keyframes pulse {
    70% { box-shadow: 0 0 0 8px rgba(76,191,143,0); }
    100% { box-shadow: 0 0 0 0 rgba(76,191,143,0); }
  }
  .clock-block { text-align: right; }
  .clock-block .time { font-size: 22px; letter-spacing: .08em; color: var(--gold); }
  .clock-block .sub { font-size: 11px; color: var(--muted); }
  .alert-n {
    min-width: 86px; text-align: center; padding: 6px 10px;
    border: 1px solid var(--line); border-radius: 4px;
    background: var(--panel);
  }
  .alert-n .n { font-size: 18px; color: var(--amber); }
  .alert-n .l { font-size: 10px; color: var(--muted); letter-spacing: .14em; }

  .rail-wrap {
    border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, #121a17, #0e1412);
    padding: 8px 14px 10px;
    display: grid;
    grid-template-rows: auto 1fr;
    gap: 6px;
  }
  .rail-label {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 11px; letter-spacing: .18em; color: var(--faint); text-transform: uppercase;
  }
  .rail {
    display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px;
    scrollbar-width: thin; scrollbar-color: var(--line-2) transparent;
  }
  .strip {
    flex: 0 0 248px;
    border: 1px solid var(--line);
    background: var(--panel);
    padding: 8px 10px 9px;
    position: relative;
    cursor: pointer;
    transition: border-color .15s, transform .15s, background .15s;
  }
  .strip::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
  }
  .strip.heart::before { background: var(--heart); }
  .strip.liver::before { background: var(--liver); }
  .strip.kidney::before { background: var(--kidney); }
  .strip.lung::before { background: var(--lung); }
  .strip:hover { border-color: var(--line-2); transform: translateY(-1px); }
  .strip.active {
    border-color: var(--gold);
    background: linear-gradient(180deg, #243028, #1a2420);
    box-shadow: inset 0 0 0 1px rgba(215,180,92,.25);
  }
  .strip.allocated { opacity: .55; }
  .strip.declined, .strip.shared { opacity: .45; filter: grayscale(.4); }
  .strip.critical { animation: crit 1.2s ease-in-out infinite; }
  @keyframes crit {
    50% { box-shadow: 0 0 0 1px rgba(224,154,58,.55); }
  }
  .strip-top { display: flex; justify-content: space-between; align-items: center; }
  .oid { font-size: 12px; letter-spacing: .04em; color: var(--gold); }
  .otype { font-size: 11px; color: var(--muted); }
  .strip-mid { display: flex; justify-content: space-between; margin-top: 6px; gap: 8px; }
  .meta { font-size: 11px; color: var(--muted); line-height: 1.45; }
  .cit {
    text-align: right;
  }
  .cit .remain { font-size: 16px; letter-spacing: .04em; }
  .cit .remain.warn { color: var(--amber); }
  .cit .remain.hot { color: var(--red); }
  .cit .cap { font-size: 10px; color: var(--faint); }
  .bar { height: 3px; background: #24332c; margin-top: 8px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--green); }
  .bar.warn > i { background: var(--amber); }
  .bar.hot > i { background: var(--red); }
  .hla-mini { margin-top: 6px; font-size: 10px; color: var(--faint); letter-spacing: .02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .st-pill {
    position: absolute; right: 8px; bottom: 22px;
    font-size: 9px; letter-spacing: .12em; padding: 1px 5px;
    border: 1px solid var(--line-2); color: var(--muted);
  }

  .bench {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 372px;
    min-height: 0;
  }
  .main {
    display: grid;
    grid-template-rows: auto minmax(0, 1fr) 214px;
    min-height: 0;
    border-right: 1px solid var(--line);
  }
  .filters {
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    padding: 8px 12px;
    border-bottom: 1px solid var(--line);
    background: #121916;
  }
  .chip {
    border: 1px solid var(--line);
    background: transparent;
    color: var(--muted);
    font-size: 11px;
    padding: 4px 9px;
    border-radius: 99px;
  }
  .chip.on { border-color: var(--gold); color: var(--gold); background: rgba(215,180,92,.08); }
  .filters label { font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .filters select, .filters input[type="search"] {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--line);
    padding: 4px 8px;
    font-size: 12px;
    outline: none;
  }
  .filters input[type="search"] { width: 168px; }
  .mode-seg { display: flex; border: 1px solid var(--line); }
  .mode-seg button {
    background: transparent; color: var(--muted); border: 0;
    padding: 4px 10px; font-size: 11px;
  }
  .mode-seg button.on { background: var(--gold); color: #1a1408; font-weight: 650; }

  .table-wrap { overflow: auto; min-height: 0; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  thead th {
    position: sticky; top: 0; z-index: 1;
    background: #1a2420;
    color: var(--muted);
    font-weight: 550;
    letter-spacing: .04em;
    text-align: left;
    padding: 7px 8px;
    border-bottom: 1px solid var(--line);
    cursor: pointer;
    white-space: nowrap;
    user-select: none;
  }
  thead th .arr { color: var(--gold); margin-left: 3px; }
  tbody td {
    padding: 6px 8px;
    border-bottom: 1px solid rgba(42,60,52,.7);
    white-space: nowrap;
    vertical-align: middle;
  }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: rgba(110,200,188,.06); }
  tbody tr.sel { background: rgba(215,180,92,.12); }
  tbody tr.sel td:first-child { box-shadow: inset 3px 0 0 var(--gold); }
  .score { font-weight: 650; }
  .score.hi { color: var(--green); }
  .score.mid { color: var(--gold); }
  .score.lo { color: var(--amber); }
  .flag {
    display: inline-block; font-size: 10px; padding: 0 5px; margin-right: 3px;
    border: 1px solid var(--line-2); color: var(--amber); border-radius: 2px;
  }
  .okdot, .nodot {
    display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 5px;
  }
  .okdot { background: var(--green); }
  .nodot { background: var(--red); }
  .buf.neg { color: var(--red); font-weight: 650; }
  .buf.tight { color: var(--amber); }
  .buf.ok { color: var(--green); }
  .empty {
    padding: 36px; text-align: center; color: var(--muted); font-size: 13px;
  }

  .charts {
    display: grid;
    grid-template-columns: 1.15fr .85fr;
    border-top: 1px solid var(--line);
    min-height: 0;
  }
  .chart {
    padding: 8px 10px 6px;
    min-width: 0;
    display: grid;
    grid-template-rows: auto 1fr;
  }
  .chart + .chart { border-left: 1px solid var(--line); }
  .chart h3 {
    font-size: 11px; font-weight: 550; letter-spacing: .14em;
    color: var(--muted); text-transform: uppercase;
    display: flex; justify-content: space-between;
  }
  .chart h3 span { letter-spacing: 0; color: var(--faint); font-weight: 400; }
  svg.plot { width: 100%; height: 100%; display: block; }
  .tip {
    position: fixed; pointer-events: none; z-index: 20;
    background: #0f1613; border: 1px solid var(--gold);
    color: var(--text); font-size: 11px; padding: 6px 8px;
    max-width: 220px; display: none;
  }

  .docket {
    background:
      linear-gradient(90deg, rgba(0,0,0,.25), transparent 12px),
      repeating-linear-gradient(180deg, #1c1913 0 28px, #1a1711 28px 29px);
    color: var(--docket-paper);
    display: grid;
    grid-template-rows: auto minmax(0, 1fr);
    min-height: 0;
  }
  .docket-head {
    padding: 10px 14px 8px;
    border-bottom: 1px dashed var(--docket-line);
  }
  .docket-head .k { font-size: 10px; letter-spacing: .22em; color: #9a8b68; }
  .docket-head h2 { font-size: 15px; font-weight: 650; color: var(--docket-paper); margin-top: 2px; }
  .pair {
    margin-top: 8px; font-size: 12px; line-height: 1.5; color: #d8ccae;
  }
  .pair em { font-style: normal; color: var(--gold); }
  .docket form {
    overflow: auto; padding: 10px 14px 14px;
    display: grid; gap: 8px; align-content: start;
  }
  .row { display: grid; gap: 4px; }
  .row.two { grid-template-columns: 1fr 1fr; gap: 8px; }
  .docket label { font-size: 10px; letter-spacing: .12em; color: #9a8b68; }
  .docket select, .docket input, .docket textarea {
    width: 100%;
    background: #12100c;
    color: var(--docket-paper);
    border: 1px solid var(--docket-line);
    padding: 6px 8px;
    font-size: 12px;
    outline: none;
  }
  .docket textarea { min-height: 56px; resize: vertical; }
  .checks { display: grid; gap: 6px; font-size: 12px; color: #d8ccae; }
  .checks label { letter-spacing: 0; color: #d8ccae; display: flex; gap: 8px; align-items: flex-start; }
  .warnbox {
    font-size: 11px; color: #e0b36a; border: 1px solid #5a4a28;
    padding: 6px 8px; background: rgba(224,154,58,.08); display: none;
  }
  .errbox {
    font-size: 11px; color: #f0a0a0; border: 1px solid #5a3030;
    padding: 6px 8px; background: rgba(224,86,86,.08); display: none;
  }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 4px; }
  .btn {
    border: 1px solid var(--gold); background: var(--gold); color: #1a1408;
    padding: 8px 10px; font-size: 12px; font-weight: 700; letter-spacing: .12em;
  }
  .btn.ghost { background: transparent; color: var(--docket-paper); border-color: var(--docket-line); }
  .stamp {
    display: none; text-align: center; margin-top: 4px;
    border: 2px solid var(--green); color: var(--green);
    transform: rotate(-8deg); font-weight: 800; letter-spacing: .2em;
    padding: 4px; font-size: 13px;
  }
  .stamp.show { display: block; }

  .ledger {
    border-top: 1px solid var(--line);
    background: #0f1512;
    display: grid;
    grid-template-rows: auto minmax(0, 1fr);
    min-height: 0;
  }
  .ledger-h {
    display: flex; justify-content: space-between; align-items: center;
    padding: 6px 12px; font-size: 11px; letter-spacing: .16em; color: var(--faint);
    text-transform: uppercase;
  }
  .ledger-h select {
    background: var(--panel); color: var(--text); border: 1px solid var(--line);
    font-size: 11px; padding: 3px 6px;
  }
  .ledger .table-wrap { max-height: 100%; }
  .toast {
    position: fixed; right: 18px; bottom: 18px; z-index: 30;
    background: #1d2a24; border: 1px solid var(--green); color: var(--text);
    padding: 10px 14px; font-size: 12px; display: none; box-shadow: var(--shadow);
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">
      <svg class="mark" viewBox="0 0 34 34" aria-hidden="true">
        <circle cx="17" cy="17" r="15.5" fill="none" stroke="#d7b45c" stroke-width="1.2"/>
        <path d="M17 6v11l7 4" fill="none" stroke="#e09a3a" stroke-width="1.6" stroke-linecap="round"/>
        <circle cx="17" cy="17" r="2" fill="#e05656"/>
        <path d="M8 17h4M22 17h4M17 8v3M17 23v3" stroke="#6ec8bc" stroke-width="1"/>
      </svg>
      <div>
        <h1>缺血钟 · SUTURE WINDOW</h1>
        <p>华东人体器官获取组织 · 夜班配型裁决台</p>
      </div>
    </div>
    <div class="shift">
      <span class="pulse-dot"></span>
      <span>班次 <b>N-02</b></span>
      <span>协调员 <b>林晏</b></span>
      <span>值班外科 <b>赵衡</b></span>
      <span>在岗中心 <b>11</b></span>
    </div>
    <div class="alert-n">
      <div class="n mono" id="critCount">0</div>
      <div class="l">CIT &lt; 90′</div>
    </div>
    <div class="clock-block">
      <div class="time mono" id="clock">--:--:--</div>
      <div class="sub">上海时区 · 倒计时按获取完成起算</div>
    </div>
  </header>

  <section class="rail-wrap">
    <div class="rail-label">
      <span>在途器官条带 · 点击进入配型面</span>
      <span id="railHint">等待选择</span>
    </div>
    <div class="rail" id="rail"></div>
  </section>

  <section class="bench">
    <div class="main">
      <div class="filters">
        <div class="mode-seg" id="transportMode">
          <button data-mode="ground" class="on">陆运推演</button>
          <button data-mode="hsr">高铁</button>
          <button data-mode="heli">直升机</button>
        </div>
        <button class="chip" data-f="abo">仅 ABO 同型</button>
        <button class="chip" data-f="hla">HLA-MM ≤ 2</button>
        <button class="chip" data-f="or">手术室就绪</button>
        <button class="chip" data-f="win">窗口内可达</button>
        <label>HLA 上限
          <select id="hlaMax">
            <option value="6">6</option>
            <option value="4">4</option>
            <option value="3">3</option>
            <option value="2">2</option>
            <option value="1">1</option>
            <option value="0">0</option>
          </select>
        </label>
        <label>紧急度
          <select id="urgMin">
            <option value="0">全部</option>
            <option value="70">高优先</option>
            <option value="85">极紧急</option>
          </select>
        </label>
        <input type="search" id="q" placeholder="等候号 / 中心 / 姓名">
        <span class="mono" id="countHint" style="margin-left:auto;color:var(--faint);font-size:11px"></span>
      </div>
      <div class="table-wrap" id="tableWrap"></div>
      <div class="charts">
        <div class="chart">
          <h3>可达性散点 <span>横轴转运分钟 · 纵轴综合配型分 · 半径紧急度</span></h3>
          <div id="scatter"></div>
        </div>
        <div class="chart">
          <h3>选定对的冷缺血预算 <span id="citCaption">选择等候者后显示</span></h3>
          <div id="citChart"></div>
        </div>
      </div>
    </div>
    <aside class="docket">
      <div class="docket-head">
        <div class="k">ALLOCATION DOCKET · 放行签发单</div>
        <h2>夜间分配决定</h2>
        <div class="pair" id="pairLine">先在条带中选择器官，再点选等候者。</div>
      </div>
      <form id="form" autocomplete="off">
        <div class="row">
          <label>决定</label>
          <select name="decision">
            <option value="allocate">分配给主受体</option>
            <option value="backup">分配并指定备选</option>
            <option value="decline">拒绝此器官</option>
            <option value="share">转区域共享</option>
          </select>
        </div>
        <div class="row two" id="backupRow" style="display:none">
          <div>
            <label>备选等候号</label>
            <select name="backupId"></select>
          </div>
          <div>
            <label>共享区域</label>
            <select name="region">
              <option value="华东">华东</option>
              <option value="华北">华北</option>
              <option value="全国">全国紧急共享</option>
            </select>
          </div>
        </div>
        <div class="row two">
          <div>
            <label>转运方式</label>
            <select name="transport">
              <option value="ground">陆运</option>
              <option value="hsr">高铁</option>
              <option value="heli">直升机</option>
            </select>
          </div>
          <div>
            <label>接台手术间</label>
            <select name="orRoom"></select>
          </div>
        </div>
        <div class="row">
          <label>虚拟交叉配型</label>
          <select name="xm">
            <option value="neg">阴性 · 可放行</option>
            <option value="pos">阳性 · 需主任特批</option>
          </select>
        </div>
        <div class="row" id="reasonRow" style="display:none">
          <label>拒绝 / 共享原因</label>
          <select name="reason">
            <option value="">请选择</option>
            <option>无窗口内合适受体</option>
            <option>供体质量不足以支持当前名单</option>
            <option>感染风险不可接受</option>
            <option>体型匹配失败</option>
            <option>中心拒收</option>
            <option>超时风险</option>
          </select>
        </div>
        <div class="checks">
          <label><input type="checkbox" name="consent"> 受体知情同意与手术同意书已核验</label>
          <label><input type="checkbox" name="team"> 取器组、接台组与体外循环已口头确认</label>
          <label><input type="checkbox" name="override"> 窗口不足或交叉配型阳性 · 申请值班外科特批</label>
        </div>
        <div class="row">
          <label>特批说明 / 交接备注</label>
          <textarea name="note" placeholder="例如：1A 受体机械循环支持中，直升机 00:40 起飞，备选为 WL-…"></textarea>
        </div>
        <div class="warnbox" id="warnbox"></div>
        <div class="errbox" id="errbox"></div>
        <div class="actions">
          <button type="submit" class="btn">签发</button>
          <button type="button" class="btn ghost" id="resetBtn">清空</button>
        </div>
        <div class="stamp" id="stamp">已签发 ALLOCATED</div>
      </form>
    </aside>
  </section>

  <section class="ledger">
    <div class="ledger-h">
      <span>本班签发账 · 可按决定筛选</span>
      <select id="ledgerFilter">
        <option value="all">全部决定</option>
        <option value="allocate">分配</option>
        <option value="backup">分配+备选</option>
        <option value="decline">拒绝</option>
        <option value="share">区域共享</option>
      </select>
    </div>
    <div class="table-wrap" id="ledgerWrap"></div>
  </section>
</div>
<div class="tip" id="tip"></div>
<div class="toast" id="toast"></div>

<script>
(function () {
  "use strict";

  const CITIES = {
    "上海": [121.47, 31.23],
    "杭州": [120.16, 30.25],
    "南京": [118.80, 32.06],

      acc += s.v;
      return `<rect x="${x}" y="${y0}" width="${ww}" height="${bh}" fill="${s.col}"/>
        <text x="${x + 4}" y="${y0 - 6}" fill="#87a094" font-size="10">${s.l} ${Math.round(s.v)}′</text>`;
    }).join("");
    const eta = used + m.travel + m.prep;
    const overflow = Math.max(0, eta - limit);
    const overRect = overflow
      ? `<rect x="${scale(limit)}" y="${y0}" width="${Math.min(iw, overflow/limit*iw)}" height="${bh}" fill="#e05656"/>`
      : "";
    const needle = `<line x1="${scale(Math.min(eta, limit + overflow))}" y1="${y0-10}" x2="${scale(Math.min(eta, limit + overflow))}" y2="${y0+bh+10}" stroke="#e7eee8" stroke-width="1.5"/>`;
    const hla = o.hla.map((a,i) => {
      const loc = i - (i % 2);
      const match = a === c.hla[loc] || a === c.hla[loc + 1];
      const x = 16 + i * ((w - 32) / 6);
      return `<rect x="${x}" y="108" width="${(w-40)/6 - 6}" height="22" fill="${match ? "#1e3a30" : "#3a2424"}" stroke="${match ? "#4cbf8f" : "#e05656"}"/>
        <text x="${x+4}" y="123" fill="#e7eee8" font-size="10" font-family="Consolas,monospace">${a}</text>
        <text x="${x+4}" y="148" fill="#87a094" font-size="10" font-family="Consolas,monospace">${c.hla[i]}</text>`;
    }).join("");
    document.getElementById("citCaption").textContent =
      (m.buffer >= 0 ? "缓冲 +" + Math.round(m.buffer) + "′" : "超窗 " + Math.round(m.buffer) + "′") +
      " · HLA-MM " + m.mm + " · " + ({ground:"陆运",hsr:"高铁",heli:"直升机"}[state.mode]);
    el.innerHTML = `${svgEl(w,h)}
      <text x="16" y="18" fill="#87a094" font-size="11">极限 ${ORGANS_META[o.type].citH}h · 吻合开始预估 ${Math.round(eta)}′</text>
      <rect x="${x0}" y="${y0}" width="${iw}" height="${bh}" fill="#101714" stroke="#2a3c34"/>
      ${bars}${overRect}${needle}
      <text x="${x0}" y="${y0+bh+16}" fill="#5d7468" font-size="10">0</text>
      <text x="${x0+iw-20}" y="${y0+bh+16}" fill="#5d7468" font-size="10">CIT 极限</text>
      <text x="16" y="102" fill="#5d7468" font-size="10">HLA 指纹 · 上供体 / 下受体</text>
      ${hla}
    </svg>`;
  }

  let lastPairKey = "";
  function renderForm(now) {
    const o = organById(state.selectedOrganId);
    const c = candidates.find(x => x.id === state.selectedCandidateId);
    const form = document.getElementById("form");
    const pair = document.getElementById("pairLine");
    const warn = document.getElementById("warnbox");
    if (!o) { pair.textContent = "未选择器官。"; return; }
    if (!c) { pair.innerHTML = `<em>${esc(o.id)}</em> 已选，等候者未选。`; return; }
    const m = pairMetrics(o, c, state.mode, now);
    pair.innerHTML = `器官 <em>${esc(o.id)}</em> ${esc(ORGANS_META[o.type].label)} ${esc(o.blood)} → 受体 <em>${esc(c.id)}</em> ${esc(c.name)} · ${esc(c.hospital)}<br>配型 ${m.score} 分 · 错配 ${m.mm} · 缓冲 ${m.buffer < 0 ? Math.round(m.buffer) : "+" + Math.round(m.buffer)}′`;
    const pairKey = o.id + "|" + c.id + "|" + state.mode;
    if (pairKey !== lastPairKey) {
      const keepBackup = form.backupId.value;
      const others = visibleRows(now).filter(r => r.c.id !== c.id).slice(0, 12);
      form.backupId.innerHTML = others.map(r => `<option value="${r.c.id}">${esc(r.c.id)} ${esc(r.c.name)} ${r.score}分</option>`).join("") || `<option value="">无</option>`;
      if (keepBackup && others.some(r => r.c.id === keepBackup)) form.backupId.value = keepBackup;
      const rooms = [c.orRoom, "OR-3", "OR-5", "夜间急诊2", "杂交1"].filter((v,i,a)=>a.indexOf(v)===i);
      const keepOr = form.orRoom.value;
      form.orRoom.innerHTML = rooms.map(v => `<option>${v}</option>`).join("");
      if (rooms.indexOf(keepOr) >= 0) form.orRoom.value = keepOr;
      form.transport.value = state.mode;
      lastPairKey = pairKey;
    }
    const notes = [];
    if (m.buffer < 0) notes.push("当前转运方式无法在冷缺血极限前开始吻合。改用直升机，或勾选特批。");
    if (!c.orReady) notes.push("接台中心夜班体外循环组未就绪。");
    if (!m.aboOk) notes.push("ABO 不相容，禁止常规分配。");
    if (c.pra >= 80) notes.push("高 PRA，虚拟交叉配型风险升高。");
    if (o.status !== "pending") notes.push("该器官已有终态决定，不能重复签发。");
    warn.style.display = notes.length ? "block" : "none";
    warn.textContent = notes.join(" ");
  }

  function renderLedger() {
    const f = state.ledgerFilter;
    const rows = decisions.filter(d => f === "all" || d.decision === f).slice().sort((a,b) => b.t - a.t);
    const lab = { allocate:"分配", backup:"分配+备选", decline:"拒绝", share:"区域共享" };
    const html = `<table><thead><tr>
      <th>时间</th><th>器官</th><th>等候号</th><th>受体</th><th>中心</th><th>决定</th><th>转运</th><th>缓冲′</th><th>签发</th>
    </tr></thead><tbody>${
      rows.map(d => `<tr>
        <td class="mono">${fmtClock(new Date(d.t))}</td>
        <td class="mono">${esc(d.organId)} ${esc(d.organLabel)}</td>
        <td class="mono">${esc(d.candId)}</td>
        <td>${esc(d.name)}</td>
        <td>${esc(d.hospital)}</td>
        <td>${lab[d.decision] || d.decision}</td>
        <td>${({ground:"陆运",hsr:"高铁",heli:"直升机"}[d.transport] || "—")}</td>
        <td class="mono">${d.buffer == null ? "—" : Math.round(d.buffer)}</td>
        <td>${esc(d.by)}</td>
      </tr>`).join("") || `<tr><td colspan="9">本筛选下无记录</td></tr>`
    }</tbody></table>`;
    document.getElementById("ledgerWrap").innerHTML = html;
  }

  function toast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.style.display = "block";
    clearTimeout(toast._id);
    toast._id = setTimeout(() => { t.style.display = "none"; }, 2800);
  }

  function render() {
    const now = Date.now();
    renderClock(now);
    renderRail(now);
    renderTable(now);
    renderScatter(now);
    renderCit(now);
    renderForm(now);
    renderLedger();
  }

  document.getElementById("rail").addEventListener("click", e => {
    const s = e.target.closest(".strip");
    if (!s) return;
    state.selectedOrganId = s.dataset.id;
    state.selectedCandidateId = null;
    lastPairKey = "";
    document.getElementById("stamp").classList.remove("show");
    document.getElementById("errbox").style.display = "none";
    render();
  });
  document.getElementById("tableWrap").addEventListener("click", e => {
    const th = e.target.closest("th");
    if (th && th.dataset.k) {
      if (state.sort.key === th.dataset.k) state.sort.dir *= -1;
      else { state.sort.key = th.dataset.k; state.sort.dir = th.dataset.k === "score" ? -1 : 1; }
      render();
      return;
    }
    const tr = e.target.closest("tr[data-id]");
    if (!tr) return;
    state.selectedCandidateId = tr.dataset.id;
    render();
  });
  document.getElementById("scatter").addEventListener("click", e => {
    const d = e.target.closest(".dot");
    if (!d) return;
    state.selectedCandidateId = d.dataset.id;
    render();
  });
  const tip = document.getElementById("tip");
  document.getElementById("scatter").addEventListener("mousemove", e => {
    const d = e.target.closest(".dot");
    if (!d) { tip.style.display = "none"; return; }
    const c = candidates.find(x => x.id === d.dataset.id);
    const o = organById(state.selectedOrganId);
    if (!c || !o) return;
    const m = pairMetrics(o, c, state.mode, Date.now());
    tip.style.display = "block";
    tip.style.left = (e.clientX + 12) + "px";
    tip.style.top = (e.clientY + 12) + "px";
    tip.innerHTML = `<b>${esc(c.id)}</b> ${esc(c.name)}<br>${esc(c.hospital)} · 分 ${m.score} · 运 ${m.travel}′ · 缓冲 ${Math.round(m.buffer)}′`;
  });
  document.getElementById("scatter").addEventListener("mouseleave", () => { tip.style.display = "none"; });

  document.getElementById("transportMode").addEventListener("click", e => {
    const b = e.target.closest("button[data-mode]");
    if (!b) return;
    state.mode = b.dataset.mode;
    [...e.currentTarget.children].forEach(x => x.classList.toggle("on", x === b));
    document.getElementById("form").transport.value = state.mode;
    render();
  });
  document.querySelector(".filters").addEventListener("click", e => {
    const chip = e.target.closest(".chip");
    if (!chip) return;
    const f = chip.dataset.f;
    state.filters[f] = !state.filters[f];
    chip.classList.toggle("on", state.filters[f]);
    render();
  });
  document.getElementById("hlaMax").addEventListener("change", e => { state.hlaMax = +e.target.value; render(); });
  document.getElementById("urgMin").addEventListener("change", e => { state.urgMin = +e.target.value; render(); });
  document.getElementById("q").addEventListener("input", e => { state.q = e.target.value; render(); });
  document.getElementById("ledgerFilter").addEventListener("change", e => { state.ledgerFilter = e.target.value; renderLedger(); });

  const form = document.getElementById("form");
  form.decision.addEventListener("change", () => {
    const d = form.decision.value;
    document.getElementById("backupRow").style.display = d === "backup" || d === "share" ? "grid" : "none";
    document.getElementById("reasonRow").style.display = d === "decline" || d === "share" ? "grid" : "none";
  });
  form.transport.addEventListener("change", () => {
    state.mode = form.transport.value;
    [...document.querySelectorAll("#transportMode button")].forEach(b => b.classList.toggle("on", b.dataset.mode === state.mode));
    render();
  });
  form.addEventListener("submit", e => {
    e.preventDefault();
    const now = Date.now();
    const o = organById(state.selectedOrganId);
    const c = candidates.find(x => x.id === state.selectedCandidateId);
    const err = document.getElementById("errbox");
    const showErr = m => { err.style.display = "block"; err.textContent = m; };
    if (!o || o.status !== "pending") return showErr("该器官不可签发。");
    const d = form.decision.value;
    if (d === "allocate" || d === "backup") {
      if (!c) return showErr("请选择主受体。");
      const m = pairMetrics(o, c, form.transport.value, now);
      if (!m.aboOk) return showErr("ABO 不相容，不能分配。");
      if (!form.consent.checked || !form.team.checked) return showErr("须核验知情同意并确认三组到位。");
      if (form.xm.value === "pos" && !form.override.checked) return showErr("交叉配型阳性必须值班外科特批。");
      if (m.buffer < 0 && !form.override.checked) return showErr("超窗分配必须特批，或改用更快转运。");
      if ((form.xm.value === "pos" || m.buffer < 0) && form.note.value.trim().length < 8)
        return showErr("特批须写明理由（不少于 8 字）。");
      if (d === "backup" && !form.backupId.value) return showErr("请指定备选等候者。");
      o.status = "allocated";
      c.status = "accepted";
      decisions.unshift({
        t: now, organId: o.id, organLabel: ORGANS_META[o.type].label,
        candId: c.id, name: c.name, hospital: c.hospital,
        decision: d, transport: form.transport.value, buffer: m.buffer, by: "林晏"
      });
      document.getElementById("stamp").classList.add("show");
      toast((d === "backup" ? "已分配并指定备选 " : "已分配给 ") + c.id);
    } else {
      if (!form.reason.value) return showErr("拒绝或共享必须选择原因。");
      o.status = d === "share" ? "shared" : "declined";
      decisions.unshift({
        t: now, organId: o.id, organLabel: ORGANS_META[o.type].label,
        candId: c ? c.id : "—", name: c ? c.name : "—", hospital: c ? c.hospital : "—",
        decision: d, transport: form.transport.value, buffer: c ? pairMetrics(o,c,form.transport.value,now).buffer : null, by: "林晏"
      });
      document.getElementById("stamp").classList.add("show");
      toast(d === "share" ? "已转入 " + form.region.value + " 共享池" : "已拒绝该器官");
    }
    lastPairKey = "";
    document.getElementById("errbox").style.display = "none";
    render();
  });
  document.getElementById("resetBtn").addEventListener("click", () => {
    form.reset();
    form.transport.value = state.mode;
    lastPairKey = "";
    document.getElementById("stamp").classList.remove("show");
    document.getElementById("errbox").style.display = "none";
    document.getElementById("backupRow").style.display = "none";
    document.getElementById("reasonRow").style.display = "none";
  });

  document.addEventListener("keydown", e => {
    if (e.target.matches("input, select, textarea")) return;
    const rows = visibleRows(Date.now());
    const idx = rows.findIndex(r => r.c.id === state.selectedCandidateId);
    if (e.key === "j" || e.key === "ArrowDown") {
      if (rows[idx + 1]) { state.selectedCandidateId = rows[idx + 1].c.id; render(); }
    } else if (e.key === "k" || e.key === "ArrowUp") {
      if (rows[idx - 1]) { state.selectedCandidateId = rows[idx - 1].c.id; render(); }
    } else if (/^[1-7]$/.test(e.key)) {
      const o = organs[+e.key - 1];
      if (o) { state.selectedOrganId = o.id; state.selectedCandidateId = null; render(); }
    }
  });

  window.addEventListener("resize", () => {
    const now = Date.now();
    renderScatter(now);
    renderCit(now);
  });
  setInterval(() => {
    const now = Date.now();
    renderClock(now);
    renderRail(now);
    const o = organById(state.selectedOrganId);
    const c = candidates.find(x => x.id === state.selectedCandidateId);
    if (o && c) {
      renderCit(now);
      const sel = document.querySelector("#tableWrap tr.sel td.buf");
      if (sel) {
        const m = pairMetrics(o, c, state.mode, now);
        sel.textContent = m.buffer < 0 ? String(Math.round(m.buffer)) : "+" + Math.round(m.buffer);
      }
    }
  }, 1000);

  render();
  requestAnimationFrame(() => {
    const now = Date.now();
    renderScatter(now);
    renderCit(now);
  });
})();
</script>
</body>
</html>
